<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do aluno</title>
</head>
<body>
    <header>
        <h1>Cadastro do aluno</h1>
    </header>
    <main>
        <section>
            <h2>formulario de cadastro</h2>
            <form action="" method="post" name="cadastro_aluno" id="casdastro_aluno">
                <label for="nome_aluno">Nome completo do aluno:</label>
                <input type="text" name="nome_aluno" id="nome_aluno" >
                <br><br>

                <label for="aluno_email">Email do aluno:</label>
                <input type="text" name="aluno_email" id="aluno_email" >
                <br><br>

                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha">
                <br>
                <label for="confirmar_senha">Conformar senha:</label>
                <input type="password" name="confirmar_senha" id="confirmar_senha">
                <br><br>

                <label for="nascimendo_aluno">Data de nascimendo do aluno</label>
                <input type="date" name="nascimendo_aluno" id="nascimendo_aluno">
                <br><br>
                <label for="aluno_genero">genero do aluno</label>
                <input type="radio" name="aluno_genero" id="aluno_maculino" value="masculino">masculino
                <input type="radio" name="aluno_genero" id="aluno_feminino" value="feminino">feminino
                <br><br>
                <label for="disciplinas">Disciplinas a cursas</label><br>
                <input type="checkbox" name="disciplinas" value="Banco_de_dados">Banco de dados
                <input type="checkbox" name="disciplinas" value="Algoritimos">Algoritimos
                <input type="checkbox" name="disciplinas" value="Novas_tecnogias">Novas tecnogias
                <input type="checkbox" name="disciplinas" value="Sistemas_operecionais">Sistemas operecionais
                <br><br>
                <label for="semestre">Em qual semestre deseja se matricular:</label><br>
                <select name="semestre" id="semestre">
                    <option value="1semestre">1º semestre</option>
                    <option value="2semestre">2º semestre</option>
                    <option value="3semestre">3º semestre</option>
                    <option value="4semestre">4º semestre</option>
                    <option value="5semestre">5º semestre</option>
                    <option value="6semestre">6º semestre</option>
                </select>
                <br><br>
                <label for="observacoes">observações:</label>
                <textarea name="observacoes" id="observacoes" rows="5" cols="50"></textarea>
                <br><br>
            </form>
        </section>
    </main>
    <footer>
        <p>if-pr</p>
        <p>2026</p>
    </footer>
</body>
</html>
