<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrições</title>
</head>
<body>
    <header>
        <h1>Inscrições para cursos técnicos</h1>
    </header>
    <main>
        <section>
            <form action="" method="post" name="inscricoes" id="inscricoes">

                <label for="nome_completo">Nome completo:</label>
                <input type="text" name="nome_completo" id="nome_completo" ><br>
                <br>

                <label for="cpf">CPF:</label>
                <input type="number" name="cpf" id="cpf" ><br>
                <br>

                <label for="nacimento">Data de nacimento:</label>
                <input type="date" name="nacimento" id="nacimento"><br>
                <br>

                <label for="endereco">Endereço:</label><br>
                <label for="rua">Rua:</label>
                <input type="text" name="rua" id="rua"><br>
                <label for="numero">Numero:</label>
                <input type="number" name="numero" id="numero"><br>
                <label for="cidade">Cidade:</label>
                <input type="text" name="cidade" id="cidade"><br>
                <label for="estado">Estado:</label>
                <input type="text" name="estado" id="estado"><br>
                <br>

                <label for="cursos">Cursos desejado</label>
                <select name="" id="">
                    <option value="0"></option>
                    <option value="1">Novas Tecnologias e Sistemas              </option>
                    <option value="2">Linguagem e Técnicas de Programação       </option>
                    <option value="3">Desenvolvimento de Aplicações Móveis      </option>
                    <option value="4">Ciência e Análise de Dados                </option>
                    <option value="5">Inteligência Artificial e Machine Learning</option>
                    <option value="6">Cibersegurança                            </option>
                    <option value="7">Computação em Nuvem                       </option>
                    <option value="8">Administração de Redes                    </option>
                    <option value="9">Design UI                                 </option>
                    <option value="10">Bacos de Dados                           </option>
                    <option value="11">Internet das Coisas                      </option>
                    <option value="12">Blockchain                               </option>
                    <option value="13">Desenvolvimento de Jogos                 </option>
                    <option value="14">DevOps                                   </option>
                    <option value="15">Desenvolvimento Web                      </option>
                    <option value="16">Engenharia de Software                   </option>
                    <option value="17">Desenvolvimento Full Stack               </option>
                    <option value="18">Arquitetura de Software                  </option>
                    <option value="19">Testes de Software                       </option>
                    <option value="20">Big Data                                 </option>
                    <option value="21">Engenharia de Dados                      </option>
                    <option value="22">Deep Learning                            </option>
                    <option value="23">Visão Computacional                      </option>
                    <option value="24">Administração de Sistemas Linux          </option>
                    <option value="25">Redes de Computadores                    </option>
                    <option value="26">Ethical Hacking                          </option>
                    <option value="27">Criptografia                             </option>
                    <option value="28">Gestão de Servidores                     </option>
                    <option value="29">Modelação 3D                             </option>
                    <option value="30">Edição de Vídeo                          </option>
                    <option value="31">Computação Quântica                      </option>
                    <option value="32">Realidade Virtual                        </option>
                    <option value="33">Metaverso                                </option>
                    <option value="34">Automação Industrial                     </option>
                    <option value="35">Robótica Educacional                     </option>
                    <option value="36">Sistemas Embarcados                      </option>
                    <option value="37">Drones e Tecnologias Autónomas           </option>
                    <option value="38">Gestão de Projetos de TI                 </option>
                    <option value="39">Transformação Digital                    </option>
                    <option value="40">Marketing Digital                        </option>
                </select><br>
                <br>
                
                <label for="turno">Turno:</label>
                <input type="radio" name="turno" id="turno" value="matutino"  >Matutino
                <input type="radio" name="turno" id="turno" value="vespertino">Vespertino
                <input type="radio" name="turno" id="turno" value="noturno"   >Noturno
                <br><br>

                <label for="experiencia">Já possui experiência na área?</label>
                <input type="radio" name="experiencia" id="experiencia" value="sim">sim
                <input type="radio" name="experiencia" id="experiencia" value="nao">não
                <br><br>

                <label for="interesse">Áreas de interesse:</label>
                <input type="checkbox" name="interesse" id="interesse">
                <br><br>

                <label for="documento">Upload de documento:</label>
                <input type="file" name="documento" id="documento">
                <br><br>

              

                <input type="submit" name="enviar" value="Enviar" size="2"><br>
            </form>
        </section>
    </main>
    <footer>
        <p>if-pr</p>
        <p>2026</p>
    </footer>
</body>
</html>
